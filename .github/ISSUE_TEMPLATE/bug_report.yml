name: Bug report
description: Report a context, playback, or compatibility problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: editor
    attributes:
      label: Editor
      options: [VS Code, Cursor]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Editor and extension versions
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Adaptive Music diagnostics
      description: Run “Adaptive Music: Show Diagnostics.” Remove anything you do not want to share.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I confirmed the report contains no source code, credentials, or private workspace data.
          required: true
