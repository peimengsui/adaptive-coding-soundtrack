name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vscode-version: ["1.95.3", "stable"]
    env:
      VSCODE_TEST_VERSION: ${{ matrix.vscode-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: xvfb-run -a npm run test:integration

  package:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run package
      - run: npm run check:package
      - uses: actions/upload-artifact@v7
        with:
          name: adaptive-coding-soundtrack-vsix
          path: "*.vsix"
          if-no-files-found: error
